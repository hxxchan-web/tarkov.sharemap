<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Tarkov Shared Map v19</title>
<style>
  :root{--bg:#0b0e12;--panel:#11161d;--panel2:#171d25;--line:#29313c;--text:#edf1f4;--muted:#95a0ad;--accent:#d2b46d}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
  button,input{font:inherit} button{cursor:pointer}
  .app{height:100%;display:grid;grid-template-columns:165px minmax(0,1fr) 285px;overflow:hidden}
  .panel{background:var(--panel);overflow:auto}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}
  .brand{padding:10px;border-bottom:1px solid var(--line)} .brand h1{margin:0;font-size:16px;letter-spacing:.05em} .brand small{color:var(--muted);font-size:11px}
  .section{padding:8px}.section-title{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
  .map-list,.trader-grid{display:grid;gap:4px}
  .map-btn,.trader-btn,.small-btn,.toggle-chip{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:5px 7px;text-align:left;font-size:11px}
  .map-btn.active,.trader-btn.active,.small-btn.active,.toggle-chip.active{border-color:var(--accent);box-shadow:0 0 0 1px rgba(210,180,109,.18)}
  .small-btn{padding:5px 8px;text-align:center}
  .main{min-width:0;display:flex;flex-direction:column;overflow:hidden}
  .topbar{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);background:#0f1318}
  .title{font-weight:700;margin-right:auto}.subtle{color:var(--muted);font-size:11px}.floorbar{display:flex;gap:4px;align-items:center;overflow:auto;max-width:40vw}.floor-btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:7px;padding:4px 6px;font-size:9px;white-space:nowrap}.floor-btn.active{border-color:var(--accent);color:#ffe7a7}.exit-toggle.active{border-color:var(--accent);color:#c7f5a7}.exit-filters{display:flex;gap:4px;align-items:center;flex-wrap:wrap}.exit-filter{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:7px;padding:4px 6px;font-size:10px;white-space:nowrap}.exit-filter input{margin:0}.pin-item.builtin{pointer-events:none;z-index:2}.pin-item.builtin .pin-hit{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:18px;height:18px;cursor:default}.pin-item.builtin .pin-label{position:absolute;left:11px;top:-11px;color:#ecf2f8;font-size:10px;line-height:1.1;white-space:nowrap;text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000}.pin-item.builtin.large-label .pin-label{font-size:16px;line-height:1.18}.pin-item.builtin.xlarge-label .pin-label{font-size:18px;line-height:1.18}.pin-item.user{z-index:3}.pin-item.builtin.label-left .pin-label{left:auto;right:11px;text-align:right}.pin-item.builtin.label-bottom .pin-label{left:0;top:11px}.pin-item.builtin.label-top .pin-label{left:0;top:-18px}.pin-item.builtin.label-top-left .pin-label{left:auto;right:11px;top:-18px;text-align:right}
  .map-shell{position:relative;flex:1;min-height:0;background:#0b0f13}
  #mapStage{position:absolute;inset:0;overflow:hidden;touch-action:none}
  #anchor{position:absolute;left:50%;top:50%} #content{position:relative;transform-origin:0 0}
  #mapImage{display:none;max-width:none;user-select:none;pointer-events:none;filter:brightness(.96) contrast(1.02)}#svgHost{position:relative;display:block}#svgHost>svg{display:block;width:100%;height:100%}#customFloorHost{display:none;width:1200px;height:760px}
  #pinLayer{position:absolute;left:0;top:0}
  .map-placeholder{width:1600px;height:1100px;display:grid;place-items:center;background:#10151c;border:1px solid #202833;color:#7e8894;font-size:26px}
  .pin-item{position:absolute;transform:translate(-50%,-100%);pointer-events:auto}
  .pin-item.builtin{display:flex;align-items:flex-start;gap:6px}
  .pin-item.user{display:block}
  .pin-hit{width:28px;height:32px;display:block;cursor:pointer;flex:0 0 auto;filter:drop-shadow(0 1px 4px rgba(0,0,0,.55))}.pin-item.user .pin-hit{display:flex;align-items:flex-end;justify-content:center;width:24px;height:28px}
  .pin-item.selected .pin-hit{filter:drop-shadow(0 0 0 rgba(0,0,0,0)) drop-shadow(0 0 0 2px rgba(255,233,171,.5)) drop-shadow(0 1px 4px rgba(0,0,0,.55))}
  .pin-note{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);max-width:120px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.10);color:#fff;border-radius:999px;padding:2px 7px;font-size:10px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;word-break:normal;pointer-events:none}
  .toolbar{padding:6px 8px;border-top:1px solid var(--line);background:#0f1318}
  .stampbar{display:flex;gap:5px;overflow:auto}
  .stamp{flex:0 0 auto;display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--text);padding:4px 7px;font-size:11px}
  .stamp.active{border-color:var(--accent)} .stamp-icon{width:17px;height:20px;display:block;flex:0 0 auto}
  .note-editor{margin-top:5px;padding-top:5px;border-top:1px solid var(--line);display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:6px;align-items:center}
  .note-editor input{width:100%;border:1px solid var(--line);background:#0b0f14;color:var(--text);border-radius:7px;padding:5px 8px;font-size:11px}
  .note-actions{display:flex;gap:5px;align-items:center;flex-wrap:nowrap}.note-editor .section-title{margin:0;font-size:10px}.note-actions .small-btn{padding:4px 7px;font-size:10px}.note-actions .subtle{display:none}
  .tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
  .tab{border:0;background:transparent;color:var(--muted);padding:10px 8px;font-size:12px}.tab.active{color:var(--text);border-bottom:2px solid var(--accent)}
  .task-toolbar{padding:8px;border-bottom:1px solid var(--line);display:grid;gap:6px}
  .task-toolbar input{width:100%;border:1px solid var(--line);background:#0b0f14;color:var(--text);border-radius:8px;padding:7px 8px;font-size:11px}
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .status{padding:6px 8px;font-size:10px;color:var(--muted);border-bottom:1px solid var(--line)}
  .task-list{padding:8px}
  .task-card{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px;margin-bottom:6px}
  .task-name{font-weight:700;font-size:12px} .task-meta{margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;font-size:10px;color:var(--muted)}
  .badge{border:1px solid var(--line);border-radius:999px;padding:2px 6px;font-size:10px}.rank{color:#f0d899}
  .task-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px;font-size:11px}.task-actions label{display:flex;align-items:center;gap:4px}
  .task-actions button{border:1px solid var(--line);background:#0c1015;color:var(--text);border-radius:8px;padding:4px 7px;font-size:10px}
  .now-badge{display:inline-block;margin-left:6px;color:#c4f29c;font-size:11px}.done-badge{display:inline-block;margin-left:6px;color:#a2b0bf;font-size:11px}
  .trader-grid{padding:8px;grid-template-columns:1fr 1fr}
  .mobile-toggle{display:none}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
  .modal.show{display:flex}.modal-card{width:min(720px,100%);max-height:88vh;overflow:auto;background:#11161d;border:1px solid #3b4451;border-radius:14px}
  .modal-head{display:flex;gap:10px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)} .modal-head h2{margin:0;font-size:17px;flex:1}
  .modal-body{padding:16px}.objectives{list-style:none;padding:0;margin:12px 0 16px;display:grid;gap:8px}
  .objectives li{padding:9px 10px;background:#171d25;border:1px solid var(--line);border-radius:9px}
  .wiki{display:inline-block;color:#f3db99;text-decoration:none;border:1px solid #5b4d2d;border-radius:8px;padding:8px 10px}
  .share-btn.connected{border-color:#53b978;color:#bff4cd}.share-btn.connecting{border-color:#d2b46d;color:#ffe7a7}
  .share-card{width:min(520px,100%)}.share-status{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#0c1117;margin-bottom:10px;font-size:12px;line-height:1.5}
  .share-actions{display:flex;gap:7px;flex-wrap:wrap}.share-actions .small-btn{padding:8px 10px}.share-link{margin-top:10px;width:100%;border:1px solid var(--line);background:#080c10;color:#dce4eb;border-radius:8px;padding:8px;font-size:11px}
  .share-help{margin-top:10px;color:var(--muted);font-size:11px;line-height:1.5}
  @media(max-width:980px){.app{grid-template-columns:150px minmax(0,1fr) 265px}}
  @media(max-width:760px){.app{grid-template-columns:1fr}.left{display:none}.right{position:fixed;top:0;right:0;bottom:0;width:min(94vw,390px);transform:translateX(100%);transition:.2s;z-index:30}.right.open{transform:translateX(0)}.mobile-toggle{display:inline-block}}
</style>
</head>
<body>
<div class="app">
  <aside class="panel left">
    <div class="brand"><h1>TARKOV SHARED MAP</h1><small>Friend Raid Planner</small></div>
    <div class="section"><div class="section-title">Maps</div><div id="mapList" class="map-list"></div></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button id="mobileTasksBtn" class="small-btn mobile-toggle">タスク</button>
      <div>
        <div id="currentMapTitle" class="title">Customs</div>
        <div id="currentMapInfo" class="subtle"></div>
      </div>
      <div id="floorBar" class="floorbar"></div><button id="shareRoomBtn" class="small-btn share-btn">フレンド共有</button><button id="toggleExitsBtn" class="small-btn exit-toggle active">出口表示</button><div class="exit-filters"><label class="exit-filter"><input id="pmcExitChk" type="checkbox" checked>PMC</label><label class="exit-filter"><input id="scavExitChk" type="checkbox" checked>SCAV</label><label class="exit-filter"><input id="sharedExitChk" type="checkbox" checked>共通</label><label class="exit-filter"><input id="coopExitChk" type="checkbox" checked>共同</label></div><button id="zoomOut" class="small-btn">−</button>
      <button id="zoomReset" class="small-btn">100%</button>
      <button id="zoomIn" class="small-btn">＋</button>
    </div>
    <div class="map-shell">
      <div id="mapStage">
        <div id="anchor">
          <div id="content">
            <div id="svgHost"></div><div id="customFloorHost"></div><img id="mapImage" alt="" />
            <div id="placeholder" class="map-placeholder" style="display:none;">このマップ画像は準備中です</div>
            <div id="pinLayer"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="toolbar">
      <div class="section-title">スタンプ</div>
      <div id="stampbar" class="stampbar"></div>
      <div class="note-editor">
        <div class="section-title">選択ピンのメモ</div>
        <input id="pinNoteInput" placeholder="例: ここで集合 / 鍵必要 / 目的地" />
        <div class="note-actions">
          <button id="saveNoteBtn" class="small-btn">メモ保存</button>
          <button id="deletePinBtn" class="small-btn">選択ピンを削除</button>
          <span class="subtle">空いているマップ上をダブルクリックでピンを置けます</span>
        </div>
      </div>
    </div>
  </main>

  <aside class="panel right" id="rightPanel">
    <div class="tabs">
      <button class="tab active" data-tab="all">全タスク</button>
      <button class="tab" data-tab="trader">トレーダー別</button>
    </div>
    <div id="apiStatus" class="status">タスクデータを読み込み中…</div>

    <div id="allTab">
      <div class="task-toolbar">
        <input id="taskSearch" placeholder="タスク名を検索" />
        <div class="chips">
          <button id="filterAllBtn" class="toggle-chip active">すべて</button>
          <button id="filterMapBtn" class="toggle-chip">選択マップ関連のみ</button>
          <label class="toggle-chip"><input id="showDoneToggle" type="checkbox" /> 完了済みも表示</label>
        </div>
      </div>
      <div id="taskList" class="task-list"></div>
    </div>

    <div id="traderTab" style="display:none;">
      <div class="trader-grid" id="traderGrid"></div>
      <div class="task-toolbar" style="border-top:1px solid var(--line)">
        <input id="traderTaskSearch" placeholder="このトレーダーのタスクを検索" />
        <label class="toggle-chip"><input id="showDoneTraderToggle" type="checkbox" /> 完了済みも表示</label>
      </div>
      <div id="traderTaskList" class="task-list"></div>
    </div>
  </aside>
</div>

<div id="shareModal" class="modal">
  <div class="modal-card share-card">
    <div class="modal-head"><h2>フレンド共有</h2><button id="closeShareModal" class="small-btn">閉じる</button></div>
    <div class="modal-body">
      <div id="shareStatus" class="share-status">共有ルームに接続していません。</div>
      <div class="share-actions">
        <button id="createRoomBtn" class="small-btn">共有ルームを作成</button>
        <button id="copyInviteBtn" class="small-btn" disabled>招待リンクをコピー</button>
        <button id="leaveRoomBtn" class="small-btn" disabled>共有を終了</button>
      </div>
      <input id="inviteLink" class="share-link" readonly placeholder="ルーム作成後、ここに招待リンクが表示されます" />
      <div class="share-help">Discordなどで招待リンクをフレンドに送ってください。リンクを開くと自動で同じ共有ルームに参加し、ピン・メモ・タスク状態・表示マップが同期します。Firebaseの設定は不要です。</div>
    </div>
  </div>
</div>

<div id="taskModal" class="modal">
  <div class="modal-card">
    <div class="modal-head"><h2 id="taskModalTitle"></h2><button id="closeTaskModal" class="small-btn">閉じる</button></div>
    <div class="modal-body">
      <div id="taskModalMeta" class="task-meta"></div>
      <ul id="taskObjectives" class="objectives"></ul>
      <div id="taskKeys" style="display:none;margin:12px 0;padding:10px;border:1px solid var(--line);border-radius:10px;background:#11171e;">
        <div style="font-weight:700;margin-bottom:6px;color:#f0d899;">🔑 必要な鍵（ゲーム内表示名）</div>
        <ul id="taskKeysList" class="objectives" style="margin:0;padding-left:20px;"></ul>
      </div>
      <a id="taskWiki" class="wiki" target="_blank" rel="noopener">Wikiを開く ↗</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>

      const doc = new DOMParser().parseFromString(svgText, "image/svg+xml");
      const svg = doc.documentElement;
      if(svg.nodeName.toLowerCase() !== "svg") throw new Error("SVG parse");
      const vb = svg.viewBox?.baseVal;
      let w = parseFloat(svg.getAttribute("width")) || (vb?.width || 1200);

      if(!svg.getAttribute("viewBox")) svg.setAttribute("viewBox","0 0 "+w+" "+h);

        els.pinLayer.style.width=imageW+"px"; els.pinLayer.style.height=imageH+"px";

    }

  function normalizeTask(t){
    const trader = t.trader?.name || t.trader || "Unknown";
    const objectives = Array.isArray(t.objectives) ? t.objectives : [];
    const maps = [...new Set([...(t.map ? [mapAlias(t.map.name || t.map)] : []), ...objectives.flatMap(o => (o.maps || []).map(m => mapAlias(m.name || m)))].filter(Boolean))];
    const requirements = (t.taskRequirements || t.requirements || []).map(r => r.task?.id || r.taskId || r.id).filter(Boolean);
    return {...t, _id:t.id || t._id, _name:t.name || "Unnamed task", _trader:trader, _maps:maps, _requirements:requirements, _wiki:t.wikiLink || t.wiki || "", _objectives:objectives.map(o => o.description || o.text || "").filter(Boolean), _neededKeys:t._neededKeys || []};
  }
  function computeRanks(list){
    const memo = new Map(), visiting = new Set();
    function rank(task){
      if(memo.has(task._id)) return memo.get(task._id);
      if(visiting.has(task._id)) return 0;
      visiting.add(task._id);
      const reqTasks = task._requirements.map(id => taskIndex.get(id)).filter(Boolean);
      const r = reqTasks.length ? 1 + Math.max(...reqTasks.map(rank)) : 0;
      visiting.delete(task._id); memo.set(task._id, r); return r;
    }
    list.forEach(rank); return memo;
  }
  function seedTaskCompare(a,b){
    const traderA = TRADER_ORDER.indexOf(a._trader); const traderB = TRADER_ORDER.indexOf(b._trader);
    return (a.minPlayerLevel||0)-(b.minPlayerLevel||0)
      || ((traderA<0?99:traderA)-(traderB<0?99:traderB))
      || rankOf(a)-rankOf(b)
      || (a._sourceIndex??999999)-(b._sourceIndex??999999);
  }
  function computeTopoOrder(list){
    const indegree = new Map();
    const nextMap = new Map();
    list.forEach(t => { indegree.set(t._id, 0); nextMap.set(t._id, []); });
    list.forEach(t => {
      t._requirements.map(id => taskIndex.get(id)).filter(Boolean).forEach(req => {
        indegree.set(t._id, (indegree.get(t._id)||0) + 1);
        nextMap.get(req._id).push(t);
      });
    });
    let queue = list.filter(t => (indegree.get(t._id)||0)===0).sort(seedTaskCompare);
    const order = new Map();
    let idx = 0;
    while(queue.length){
      const cur = queue.shift();
      if(order.has(cur._id)) continue;
      order.set(cur._id, idx++);
      const nexts = (nextMap.get(cur._id) || []).sort(seedTaskCompare);
      nexts.forEach(n => {
        indegree.set(n._id, (indegree.get(n._id)||0) - 1);
        if((indegree.get(n._id)||0) <= 0) queue.push(n);
      });
      queue.sort(seedTaskCompare);
    }
    list.forEach(t => { if(!order.has(t._id)) order.set(t._id, idx++); });
    return order;
  }
  const rankOf = t => (progressionRank.get(t._id) || 0) + 1;
  const orderOf = t => (topoOrder.get(t._id) ?? 999999);
  const taskSort = (a,b) => orderOf(a)-orderOf(b) || rankOf(a)-rankOf(b) || (a.minPlayerLevel||0)-(b.minPlayerLevel||0) || (a._sourceIndex??999999)-(b._sourceIndex??999999);

  function getBuiltInExits(){

  }

  async function loadTasks(){
    els.apiStatus.textContent = "現行PvPタスクを読み込み中…";
    const base = "https://json.tarkov.dev/regular/";
    const overlayUrl = "https://cdn.jsdelivr.net/gh/tarkovtracker-org/tarkov-data-overlay@main/dist/overlay.json";

    async function get(path){
      const r = await fetch(base+path,{headers:{Accept:"application/json"},cache:"no-store"});
      if(!r.ok) throw new Error(path+" HTTP "+r.status);
      const payload = await r.json();
      return (payload && payload.data && typeof payload.data==="object") ? payload.data : {};
    }
    function asRecord(value, prop){
      const v = prop && value && value[prop] !== undefined ? value[prop] : value;
      if(Array.isArray(v)) return Object.fromEntries(v.filter(Boolean).map(x=>[x.id||x._id||crypto.randomUUID(),x]));
      return (v && typeof v==="object") ? v : {};
    }
    function findEntity(collection, id){
      if(!id) return null;
      if(typeof id==="object") return id;
      if(collection[id]) return collection[id];
      return Object.values(collection).find(x=>x && (x.id===id || x._id===id)) || null;
    }
    function translate(primary, fallback, key){
      if(typeof key!=="string") return "";
      return primary[key] ?? fallback[key] ?? key;
    }
    function isHexLike(s){ return /^[0-9a-f]{20,}$/i.test(String(s||"")); }

    try{
      const [taskBase, taskJa, taskEn, mapBase, mapJa, mapEn, traderBase, traderJa, traderEn, itemBase, itemJa, itemEn, overlay] = await Promise.all([
        get("tasks"), get("tasks_ja"), get("tasks_en"),
        get("maps"), get("maps_ja"), get("maps_en"),
        get("traders"), get("traders_ja"), get("traders_en"),
        get("items"), get("items_ja"), get("items_en"),
        fetch(overlayUrl,{cache:"no-store"}).then(r=>r.ok?r.json():({}))
      ]);

      const rawTasks = asRecord(taskBase,"tasks");
      const rawMaps = asRecord(mapBase,"maps");
      const rawTraders = asRecord(traderBase,"traders");
      const taskJaMap=asRecord(taskJa), taskEnMap=asRecord(taskEn);
      const mapJaMap=asRecord(mapJa), mapEnMap=asRecord(mapEn);
      const traderJaMap=asRecord(traderJa), traderEnMap=asRecord(traderEn);
      const rawItems=asRecord(itemBase,"items"), itemJaMap=asRecord(itemJa), itemEnMap=asRecord(itemEn);

      const sharedPatches = overlay?.tasks || {};
      const modePatches = overlay?.modes?.regular?.tasks || {};
      const additions = [
        ...Object.values(overlay?.tasksAdd || {}),
        ...Object.values(overlay?.modes?.regular?.tasksAdd || {})
      ];

      function patchTask(raw){
        const p1=sharedPatches[raw.id]||{}, p2=modePatches[raw.id]||{};
        return {...raw,...p1,...p2,objectives:p2.objectives||p1.objectives?raw.objectives:raw.objectives};
      }

      const merged = [...Object.values(rawTasks).map(patchTask), ...additions].filter(Boolean);
      const normalized = [];

      function keyNameFromValue(v){
        if(!v) return "";
        function gameDisplayName(item, fallback=""){
          if(!item) return fallback;
          const id = item.id || item._id || item.itemId;
          const en = id ? (itemEnMap[id] || itemEnMap[item.name] || itemEnMap[item.shortName]) : null;
          if(typeof en === "string" && en.trim()) return en.trim();
          if(en && typeof en === "object"){
            const n = en.name || en.shortName || en.fullName;
            if(n) return String(n).trim();
          }
          return String(item.name || item.fullName || item.shortName || fallback || "").trim();
        }
        if(typeof v === "string"){
          const item=findEntity(rawItems,v);
          return gameDisplayName(item, v);
        }
        if(typeof v === "object"){
          const id=v.id || v._id || v.itemId;
          const item=findEntity(rawItems,id) || v;
          return gameDisplayName(item, v.name || v.shortName || "");
        }
        return "";
      }
      function collectNeededKeys(raw){
        const names=[];
        const seen=new Set();
        function add(v){ const n=keyNameFromValue(v); if(n && !seen.has(n)){seen.add(n); names.push(n);} }
        function walk(v, depth=0){
          if(v==null || depth>5) return;
          if(Array.isArray(v)){ v.forEach(x=>walk(x,depth+1)); return; }
          if(typeof v === "string"){ add(v); return; }
          if(typeof v !== "object") return;
          if(v.id || v._id || v.itemId || v.name){ add(v); }
          for(const [k,val] of Object.entries(v)){
            if(["requiredKeys","neededKeys","keys","items","item"].includes(k)) walk(val,depth+1);
          }
        }
        walk(raw.neededKeys || raw.requiredKeys || []);
        (raw.objectives||[]).forEach(o=>walk(o.requiredKeys || o.neededKeys || []));
        return names;
      }

      for(let rawIndex=0; rawIndex<merged.length; rawIndex++){
        const raw0=merged[rawIndex];
        const patch = {...(sharedPatches[raw0.id]||{}),...(modePatches[raw0.id]||{})};
        if(patch.disabled===true || raw0.disabled===true) continue;

        const raw = {...raw0};
        let traderObj = findEntity(rawTraders, raw.trader);
        if(!traderObj && raw.trader && typeof raw.trader==="object") traderObj=raw.trader;
        let traderName = raw.trader?.name || traderObj?.name || "";
        traderName = translate(traderJaMap,traderEnMap,traderName);
        if(!traderName || isHexLike(traderName)) traderName = translate({},traderEnMap,traderObj?.name||"");
        if(!traderName) traderName="Unknown";

        let mapObj = findEntity(rawMaps, raw.map);
        if(!mapObj && raw.map && typeof raw.map==="object") mapObj=raw.map;
        let mapName = raw.map?.name || mapObj?.name || "";
        mapName = translate(mapJaMap,mapEnMap,mapName);

        let taskName = translate(taskJaMap,taskEnMap,raw.name);
        if(isHexLike(taskName)) taskName = translate({},taskEnMap,raw.name);
        if(!taskName || isHexLike(taskName)) continue;

        const objectives = (raw.objectives||[]).map(o=>{
          const desc = translate(taskJaMap,taskEnMap,o.description);
          const maps = (o.maps||[]).map(mid=>{
            const m=findEntity(rawMaps,mid);
            const mn=translate(mapJaMap,mapEnMap,m?.name || mid?.name || "");
            return {id:typeof mid==="string"?mid:(mid?.id||""),name:mn};
          });
          return {...o,description:desc,maps};
        });

        const reqs=(raw.taskRequirements||raw.requirements||[]).map(r=>{
          const tid=typeof r.task==="string"?r.task:(r.task?.id||r.taskId||r.id);
          return {...r,task:{id:tid}};
        });

        const t=normalizeTask({
          ...raw,
          _sourceIndex:rawIndex,
          _neededKeys:collectNeededKeys(raw),
          name:taskName,
          trader:{id:typeof raw.trader==="string"?raw.trader:(raw.trader?.id||traderObj?.id||""),name:traderName},
          map:mapName?{id:typeof raw.map==="string"?raw.map:(raw.map?.id||mapObj?.id||""),name:mapName}:null,
          objectives,
          taskRequirements:reqs
        });
        normalized.push(t);
      }

      tasks = normalized;
      taskIndex = new Map(tasks.map(t=>[t._id,t]));
      progressionRank = computeRanks(tasks);
      topoOrder = computeTopoOrder(tasks);
      els.apiStatus.textContent = "現行PvPタスク読み込み完了：" + tasks.length + "件";
      renderTraderGrid();
      renderTaskLists();
    }catch(e){
      console.error(e);
      tasks=[]; taskIndex=new Map(); progressionRank=new Map(); topoOrder=new Map();
      els.apiStatus.textContent = "タスク取得に失敗しました。ページを再読み込みしてください";
      renderTraderGrid(); renderTaskLists();
    }
  }

  function taskCard(t, state){
    const badges = t._maps.map(m => '<span class="badge">'+escapeHtml(m)+'</span>').join("");
    const current = state.active ? '<span class="now-badge">進行中</span>' : "";
    const done = state.completed ? '<span class="done-badge">完了</span>' : "";
    return '<div class="task-card"><div class="task-name">'+escapeHtml(t._name)+' '+current+done+'</div><div class="task-meta"><span class="rank">進行 '+rankOf(t)+'</span><span>'+escapeHtml(t._trader)+'</span>'+(t.minPlayerLevel ? '<span>Lv.'+t.minPlayerLevel+'</span>' : '')+badges+'</div><div class="task-actions"><label><input type="checkbox" data-active="'+t._id+'" '+(state.active?'checked':'')+'> 進行中</label><label><input type="checkbox" data-done="'+t._id+'" '+(state.completed?'checked':'')+'> 完了</label><button data-open="'+t._id+'">詳細</button></div></div>';
  }
  function updateMapInfo(){
    els.currentMapInfo.textContent = "このマップ関連タスク " + tasks.filter(t => t._maps.includes(currentMap)).length + "件";
  }
  function renderTraderGrid(){
    const fromData = [...new Set(tasks.map(t => t._trader).filter(t=>t && t!=="Unknown"))];
    const traders = fromData.sort((a,b)=>((TRADER_ORDER.indexOf(a)<0?99:TRADER_ORDER.indexOf(a))-(TRADER_ORDER.indexOf(b)<0?99:TRADER_ORDER.indexOf(b))) || a.localeCompare(b,"ja"));
    if(!traders.includes(selectedTrader)) selectedTrader = traders[0] || "";
    els.traderGrid.innerHTML = traders.map(t => '<button class="trader-btn '+(t===selectedTrader?'active':'')+'" data-trader="'+escapeHtml(t)+'">'+escapeHtml(t)+'</button>').join("");
    els.traderGrid.querySelectorAll("[data-trader]").forEach(btn => btn.onclick = () => {selectedTrader=btn.dataset.trader;renderTraderGrid();renderTraderTaskList();});
  }
  function bindTaskCardActions(root){
    root.querySelectorAll("[data-open]").forEach(btn => btn.onclick = () => showTask(taskIndex.get(btn.dataset.open)));
    root.querySelectorAll("[data-active]").forEach(cb => cb.onchange = () => {
      const states = getTaskStates(), id = cb.dataset.active, state = states[id] || {active:false,completed:false};
      state.active = cb.checked; if(cb.checked) state.completed = false; states[id] = state; saveTaskStates(states); renderTaskLists();
    });
    root.querySelectorAll("[data-done]").forEach(cb => cb.onchange = () => {
      const states = getTaskStates(), id = cb.dataset.done, state = states[id] || {active:false,completed:false};
      state.completed = cb.checked; if(cb.checked) state.active = false; states[id] = state; saveTaskStates(states); renderTaskLists();
    });
  }
  function renderAllTaskList(){
    const q = els.taskSearch.value.trim().toLowerCase(), states = getTaskStates();
    const list = tasks.filter(t => {
      const state = states[t._id] || {active:false,completed:false};
      if(!els.showDoneToggle.checked && state.completed) return false;
      if(allFilterMode==="map" && !t._maps.includes(currentMap)) return false;
      if(q && !t._name.toLowerCase().includes(q)) return false;
      return true;
    }).sort((a,b) => {
      const sa = states[a._id] || {active:false,completed:false};
      const sb = states[b._id] || {active:false,completed:false};
      if(sa.active !== sb.active) return sa.active ? -1 : 1;
      return taskSort(a,b);
    });
    els.taskList.innerHTML = list.length ? list.map(t => taskCard(t, states[t._id] || {active:false,completed:false})).join("") : '<div class="status">表示できるタスクがありません</div>';
    bindTaskCardActions(els.taskList);
  }
  function renderTraderTaskList(){
    const q = els.traderTaskSearch.value.trim().toLowerCase(), states = getTaskStates();
    const list = tasks.filter(t => {
      const state = states[t._id] || {active:false,completed:false};
      if(t._trader !== selectedTrader) return false;
      if(!els.showDoneTraderToggle.checked && state.completed) return false;
      if(q && !t._name.toLowerCase().includes(q)) return false;
      return true;
    }).sort((a,b) => {
      const sa = states[a._id] || {active:false,completed:false};
      const sb = states[b._id] || {active:false,completed:false};
      if(sa.active !== sb.active) return sa.active ? -1 : 1;
      return taskSort(a,b);
    });
    els.traderTaskList.innerHTML = list.length ? list.map(t => taskCard(t, states[t._id] || {active:false,completed:false})).join("") : '<div class="status">表示できるタスクがありません</div>';
    bindTaskCardActions(els.traderTaskList);
  }
  function renderTaskLists(){ updateMapInfo(); renderAllTaskList(); renderTraderTaskList(); }
  function wikiTaskName(t){
    const aliases = {
      "Shaking up the Teller":"Shaking Up the Teller",
      "Half-Empty":"Half Empty"
    };
    return aliases[t._name] || t._name;
  }
  function showTask(t){
    if(!t) return;
    els.taskModalTitle.textContent = t._name;
    els.taskModalMeta.innerHTML = '<span>'+escapeHtml(t._trader)+'</span>'+(t.minPlayerLevel ? '<span>Lv.'+t.minPlayerLevel+'</span>' : '')+'<span class="rank">進行 '+rankOf(t)+'</span>'+t._maps.map(m => '<span class="badge">'+escapeHtml(m)+'</span>').join("");
    els.taskObjectives.innerHTML = (t._objectives.length ? t._objectives : ["目的データなし"]).map(x => '<li>'+escapeHtml(x)+'</li>').join("");
    if(t._neededKeys && t._neededKeys.length){
      els.taskKeys.style.display = "block";
      els.taskKeysList.innerHTML = t._neededKeys.map(k => '<li>'+escapeHtml(k)+'</li>').join("");
    }else{
      els.taskKeys.style.display = "none";
      els.taskKeysList.innerHTML = "";
    }
    if(t._trader && t._trader !== "Unknown"){
      const traderPath = encodeURIComponent(t._trader);
      const taskPath = encodeURIComponent(wikiTaskName(t)).replace(/%2F/gi,"/");
      els.taskWiki.href = "https://wikiwiki.jp/eft/" + traderPath + "/" + taskPath;
      els.taskWiki.textContent = "日本語Wikiのタスクページを開く ↗";
    }else{
      els.taskWiki.href = "https://wikiwiki.jp/eft/%3A%E3%82%BF%E3%82%B9%E3%82%AF%E4%B8%80%E8%A6%A7";
      els.taskWiki.textContent = "日本語Wikiのタスク一覧を開く ↗";
    }
    els.taskWiki.style.display = "inline-block";
    els.taskModal.classList.add("show");
  }

  els.closeTaskModal.onclick = () => els.taskModal.classList.remove("show");
  els.taskModal.addEventListener("click", e => { if(e.target === els.taskModal) els.taskModal.classList.remove("show"); });
  document.querySelectorAll(".tab").forEach(btn => btn.onclick = () => { document.querySelectorAll(".tab").forEach(x => x.classList.toggle("active", x===btn)); $("allTab").style.display = btn.dataset.tab==="all" ? "block" : "none"; $("traderTab").style.display = btn.dataset.tab==="trader" ? "block" : "none"; });
  els.filterAllBtn.onclick = () => { allFilterMode = "all"; els.filterAllBtn.classList.add("active"); els.filterMapBtn.classList.remove("active"); renderAllTaskList(); };
  els.filterMapBtn.onclick = () => { allFilterMode = "map"; els.filterMapBtn.classList.add("active"); els.filterAllBtn.classList.remove("active"); renderAllTaskList(); };
  els.taskSearch.addEventListener("input", renderAllTaskList); els.traderTaskSearch.addEventListener("input", renderTraderTaskList);
  els.showDoneToggle.addEventListener("change", renderAllTaskList); els.showDoneTraderToggle.addEventListener("change", renderTraderTaskList);
  els.mobileTasksBtn.onclick = () => els.rightPanel.classList.toggle("open");
  els.toggleExitsBtn.onclick = () => {
    showBuiltInExits = !showBuiltInExits;
    els.toggleExitsBtn.classList.toggle("active", showBuiltInExits);
    els.toggleExitsBtn.textContent = showBuiltInExits ? "出口表示" : "出口非表示";
    renderPins();
  };
  [els.pmcExitChk, els.scavExitChk, els.sharedExitChk, els.coopExitChk].forEach((el) => el.onchange = () => {
    builtInExitFilters = {pmc_exit: els.pmcExitChk.checked, scav_exit: els.scavExitChk.checked, shared_exit: els.sharedExitChk.checked, coop_exit: els.coopExitChk.checked};
    renderPins();
  });
  els.shareRoomBtn.onclick = () => els.shareModal.classList.add("show");
  els.closeShareModal.onclick = () => els.shareModal.classList.remove("show");
  els.shareModal.addEventListener("click", e=>{ if(e.target===els.shareModal) els.shareModal.classList.remove("show"); });
  els.createRoomBtn.onclick = createShareRoom;
  els.leaveRoomBtn.onclick = destroySharing;
  els.copyInviteBtn.onclick = async () => {
    if(!els.inviteLink.value) return;
    try{ await navigator.clipboard.writeText(els.inviteLink.value); els.copyInviteBtn.textContent="コピーしました"; setTimeout(()=>els.copyInviteBtn.textContent="招待リンクをコピー",1400); }
    catch{ els.inviteLink.select(); document.execCommand("copy"); }
  };
  window.addEventListener("resize", () => fitMap());

  function demoTasks(){
    return [
      {id:"demo1",name:"Burning Rubber",trader:{name:"Prapor"},map:{name:"Ground Zero"},minPlayerLevel:1,wikiLink:"https://escapefromtarkov.fandom.com/wiki/Burning_Rubber",objectives:[{description:"Ground Zeroから脱出する",maps:[{name:"Ground Zero"}]}]},
      {id:"demo2",name:"Debut",trader:{name:"Prapor"},map:{name:"Customs"},minPlayerLevel:1,wikiLink:"https://escapefromtarkov.fandom.com/wiki/Debut",objectives:[{description:"CustomsでScavを倒し、ショットガンを提出する",maps:[{name:"Customs"}]}],taskRequirements:[{task:{id:"demo1"}}]},
      {id:"demo3",name:"Checking",trader:{name:"Prapor"},map:{name:"Customs"},minPlayerLevel:2,wikiLink:"https://escapefromtarkov.fandom.com/wiki/Checking",objectives:[{description:"Customsのトラックからブロンズポケットウォッチを回収する",maps:[{name:"Customs"}]}],taskRequirements:[{task:{id:"demo2"}}]}
    ];
  }

  renderMapButtons(); renderStampBar(); renderFloorBar(); setMap(currentMap); loadTasks();
  const roomFromUrl = new URL(location.href).searchParams.get("room");
  if(roomFromUrl){ els.shareModal.classList.add("show"); joinShareRoom(roomFromUrl); }
})();
</script>
</body>
</html>
