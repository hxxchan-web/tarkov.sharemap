inset:0;background:rgba(0,0,0,.62);z-index:30;display:flex;align-items:center;justify-content:center;padding:20px}.modal{width:min(680px,96vw);max-height:86vh;overflow:auto;background:#111c27;border:1px solid #3b4e61;border-radius:14px;padding:16px;box-shadow:0 20px 70px rgba(0,0,0,.5)}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.modal h2{margin:0;font-size:20px;color:#e7d2a9}.close{background:#203043;color:#d9e4ec;border:1px solid #40566d;border-radius:8px;padding:5px 9px}.task-detail{font-size:13px;line-height:1.7;color:#c9d5df}.task-detail h3{color:#e2c797;margin:14px 0 5px}.task-detail a{color:#7ebcff}.share-status{border:1px solid #36516d;background:#13283a;padding:9px;border-radius:8px;font-weight:700;margin-bottom:10px}.share-actions{display:flex;gap:8px;flex-wrap:wrap}.share-actions button{background:#1b344b;color:#e3edf4;border:1px solid #477297;border-radius:8px;padding:8px 12px;font-weight:700}.invite{width:100%;margin:10px 0;background:#0f1924;color:#dbe7f0;border:1px solid #3d5d7a;border-radius:7px;padding:8px}.share-help{font-size:12px;color:#a9bac9;line-height:1.5}.loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#94a6b8}.map-error{padding:20px;color:#e6a8a8}.right h3{font-size:13px;color:#d6c39c}.selected-box{font-size:11px;color:#9fb0bf;line-height:1.5;background:#131e29;border:1px solid #263746;border-radius:7px;padding:8px}.status-pill{display:inline-block;padding:2px 5px;border-radius:5px;background:#1b2937;font-size:10px}@media(max-width:900px){.layout{grid-template-columns:190px minmax(420px,1fr) 220px}.title{display:none}.topbar{gap:5px;padding:5px}.map-select,.floor-select,.share-btn{font-size:11px;padding:6px}}

<body>
<div id="app">
  <div class="topbar">
    <div class="title">TARKOV SHARED MAP</div>
    <select id="mapSelect" class="map-select"></select>
    <select id="floorSelect" class="floor-select"></select>
    <div class="exit-toggles">
      <label><input id="showPMC" type="checkbox" checked>PMC</label>
      <label><input id="showScav" type="checkbox" checked>SCAV</label>
      <label><input id="showShared" type="checkbox" checked>共通</label>
      <label><input id="showCoop" type="checkbox" checked>共同</label>
    </div>
    <button id="shareOpen" class="share-btn">フレンド共有</button>
  </div>
  <div class="layout">
    <aside class="side">
      <div class="section-title">タスク</div>
      <div id="taskTabs" class="tabs"></div>
      <div class="task-controls"><label><input id="showCompleted" type="checkbox"> 完了済みを表示</label></div>
      <div id="taskList" class="task-list"></div>
    </aside>
    <main class="map-wrap" id="mapWrap">
      <div id="mapStage" class="map-stage"><div class="loading">マップ読み込み中…</div></div>
      <div class="toolbar">
        <button class="stamp-btn" data-stamp="pmc_spawn">● PMCスポーン</button>
        <button class="stamp-btn" data-stamp="key_room">🔑 鍵部屋</button>
        <button class="stamp-btn active" data-stamp="task">📍 タスク</button>
        <button class="stamp-btn" data-stamp="purpose">📍 目的</button>
        <input id="memoInput" class="memo" placeholder="ピンのメモ">
        <button id="saveMemo" class="small-btn">メモ保存</button>
        <button id="deletePin" class="small-btn">選択ピンを削除</button>
      </div>
    </main>
    <aside class="side right">
      <div class="section-title">選択中</div>
      <div id="selectedInfo" class="selected-box">ピンを選択すると情報を表示します。</div>
      <h3>タスク状態</h3>
      <div id="taskSummary" class="selected-box"></div>
    </aside>
  </div>
</div>
<div id="taskModalBg" class="modal-bg hidden"><div class="modal"><div class="modal-head"><h2 id="taskModalTitle"></h2><button id="taskModalClose" class="close">閉じる</button></div><div id="taskModalBody" class="task-detail"></div></div></div>
<div id="shareModalBg" class="modal-bg hidden"><div class="modal"><div class="modal-head"><h2>フレンド共有</h2><button id="shareClose" class="close">閉じる</button></div><div id="shareStatus" class="share-status">共有ルーム未作成</div><div class="share-actions"><button id="createRoom">共有ルームを作成</button><button id="copyInvite">招待リンクをコピー</button><button id="endShare">共有を終了</button></div><input id="inviteField" class="invite" readonly><div class="share-help">Discordなどで招待リンクをフレンドに送ってください。リンクを開くと自動で同じ共有ルームに参加し、ピン・メモ・タスク状態・表示マップが同期します。Firebaseの設定は不要です。</div></div></div>

async function loadMap(){const stage=$("#mapStage");stage.innerHTML='<div class="loading">マップ読み込み中…</div>';try{const url=`https://cdn.jsdelivr.net/gh/the-hideout/tarkov-dev-svg-maps@master/maps/${mapCfg().file}`;const text=await fetch(url).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()});const box=document.createElement("div");box.className="map-content";box.innerHTML=text;const svg=box.querySelector("svg");if(!svg)throw new Error("SVGなし");svg.classList.add("map-svg");let vb=(svg.getAttribute("viewBox")||"0 0 1000 1000").trim().split(/[ ,]+/).map(Number);svgNatural={w:vb[2]||1000,h:vb[3]||1000};box.appendChild(Object.assign(document.createElement("div"),{className:"pins",id:"pinLayer"}));stage.innerHTML="";stage.appendChild(box);zoom=fitZoom();panX=0;panY=0;applyFloor();updateTransform();renderPins();wireMapInput()}catch(e){stage.innerHTML=`<div class="map-error">マップの読み込みに失敗しました。<br>${e.message}</div>`}}

function updateTransform(){const c=document.querySelector(".map-content");if(c)c.style.transform=`translate(calc(-50% + ${panX}px),calc(-50% + ${panY}px)) scale(${zoom})`}
function applyFloor(){const svg=document.querySelector(".map-svg");if(!svg)return;const floors=mapCfg().floors;floors.forEach(f=>{svg.querySelectorAll(`#${CSS.escape(f)},[data-floor="${f}"]`).forEach(el=>el.style.display=f===currentFloor?"":"none")})}
function wireMapInput(){const stage=$("#mapStage");stage.onwheel=e=>{e.preventDefault();const before=zoom;zoom=Math.max(.15,Math.min(4,zoom*(e.deltaY<0?1.1:.9)));const rect=stage.getBoundingClientRect(),mx=e.clientX-rect.left-rect.width/2,my=e.clientY-rect.top-rect.height/2;panX-=mx*(zoom/before-1);panY-=my*(zoom/before-1);updateTransform()};stage.onmousedown=e=>{if(e.button!==0||e.target.closest(".pin"))return;isPanning=true;panStart={x:e.clientX-panX,y:e.clientY-panY};stage.style.cursor="grabbing"};window.onmousemove=e=>{if(isPanning){panX=e.clientX-panStart.x;panY=e.clientY-panStart.y;updateTransform()}};window.onmouseup=e=>{if(isPanning){isPanning=false;stage.style.cursor=""}};stage.ondblclick=e=>{if(e.target.closest(".pin"))return;const p=clientToNormalized(e.clientX,e.clientY);addUserPin(p.x,p.y)};stage.onclick=e=>{if(e.target.closest(".pin"))return}}
function clientToNormalized(cx,cy){const wrap=$("#mapStage").getBoundingClientRect();const dx=(cx-(wrap.left+wrap.width/2)-panX)/zoom,dy=(cy-(wrap.top+wrap.height/2)-panY)/zoom;return{x:Math.max(0,Math.min(1,(dx+svgNatural.w/2)/svgNatural.w)),y:Math.max(0,Math.min(1,(dy+svgNatural.h/2)/svgNatural.h+USER_PIN_Y_BIAS))}}
function addUserPin(x,y){const arr=loadPins();const p={id:crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random(),x,y,floor:currentFloor,stamp:currentStamp,note:$("#memoInput").value.trim(),created:Date.now()};arr.push(p);savePins(arr);selectedPinId=p.id;renderPins();showSelected()}
function pinIcon(stamp){if(stamp.type==="exit")return `<div class="marker exit" style="color:${stamp.color}">🚪</div>`;if(stamp.type==="spawn")return `<div class="marker spawn" style="background:${stamp.color}"></div>`;if(stamp.type==="key")return `<div class="marker key" style="color:${stamp.color}">🔑</div>`;return `<div class="marker drop" style="background:${stamp.color}"><span>•</span></div>`}
function renderPins(){const layer=$("#pinLayer");if(!layer)return;layer.innerHTML="";const bigMaps=["Factory","Ground Zero","Lighthouse","Streets of Tarkov"];const sizeCls=currentMap==="Customs"?"":(bigMaps.includes(currentMap)?" xlarge-label":" large-label");(EXIT_DATA[currentMap]||[]).filter(p=>exitVisible(p.t)).forEach(p=>{const stamp=getStamp(p.t),el=document.createElement("div");el.className="pin builtin"+sizeCls;el.style.left=(p.x*100)+"%";el.style.top=(p.y*100)+"%";el.innerHTML=`<div class="pin-inner">${pinIcon(stamp)}<span class="pin-label" style="color:${stamp.color}">${p.n}</span></div>`;layer.appendChild(el)});loadPins().filter(p=>!p.floor||p.floor===currentFloor).forEach(p=>{const stamp=getStamp(p.stamp),el=document.createElement("div");el.className="pin user-pin"+(p.id===selectedPinId?" selected":"");el.style.left=(p.x*100)+"%";el.style.top=(p.y*100)+"%";el.dataset.id=p.id;el.innerHTML=`${p.note?`<div class="pin-note">${esc(p.note)}</div>`:""}<div class="pin-inner">${pinIcon(stamp)}</div>`;el.onclick=e=>{e.stopPropagation();selectedPinId=p.id;showSelected();renderPins()};el.ondblclick=e=>e.stopPropagation();layer.appendChild(el)});showSelected()}
function exitVisible(t){if(t==="pmc_exit")return $("#showPMC").checked;if(t==="scav_exit")return $("#showScav").checked;if(t==="shared_exit")return $("#showShared").checked;if(t==="coop_exit")return $("#showCoop").checked;return true}
function showSelected(){const p=loadPins().find(x=>x.id===selectedPinId);if(!p){$("#selectedInfo").innerHTML="ピンを選択すると情報を表示します。";return}const s=getStamp(p.stamp);$("#selectedInfo").innerHTML=`<b>${esc(s.label)}</b><br>マップ: ${esc(currentMap)}<br>階層: ${esc(p.floor||currentFloor)}<br>メモ: ${esc(p.note||"なし")}`;$("#memoInput").value=p.note||""}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function wireToolbar(){$$(".stamp-btn").forEach(b=>b.onclick=()=>{$$(".stamp-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");currentStamp=b.dataset.stamp});$("#saveMemo").onclick=()=>{if(!selectedPinId)return;const arr=loadPins(),p=arr.find(x=>x.id===selectedPinId);if(!p)return;p.note=$("#memoInput").value.trim();savePins(arr);renderPins()};$("#deletePin").onclick=()=>{if(!selectedPinId)return;let arr=loadPins().filter(x=>x.id!==selectedPinId);savePins(arr);selectedPinId=null;renderPins()};["#showPMC","#showScav","#showShared","#showCoop"].forEach(s=>$(s).onchange=renderPins)}
async function loadTasks(){loadStates();try{const base="https://json.tarkov.dev/regular/";const [ja,en]=await Promise.all([fetch(base+"tasks_ja.json").then(r=>r.json()),fetch(base+"tasks.json").then(r=>r.json())]);const jaArr=Array.isArray(ja)?ja:(ja.tasks||[]),enArr=Array.isArray(en)?en:(en.tasks||[]);tasksJA=jaArr.map((t,i)=>({...t,_sourceIndex:i}));tasksEN=enArr;const enById=new Map(enArr.map(t=>[t.id||t._id,t]));tasks=tasksJA.map((t,i)=>({...t,_id:t.id||t._id,_en:enById.get(t.id||t._id)||{},_sourceIndex:i})).filter(t=>t._id);computeRanks(tasks);traders=[...new Set(tasks.map(t=>(t.trader?.name||t.traderName||"")).filter(Boolean))];renderTabs();renderTaskLists()}catch(e){$("#taskList").innerHTML='<div class="task-row">タスクデータを読み込めませんでした。</div>'}}
function reqTaskIds(t){const out=[];const scan=v=>{if(!v)return;if(Array.isArray(v))return v.forEach(scan);if(typeof v!=="object")return;const type=(v.type||"").toLowerCase();if((type.includes("task")||v.task)&&v.task){const id=typeof v.task==="string"?v.task:(v.task.id||v.task._id);if(id)out.push(id)};if(v.target?.id&&type.includes("task"))out.push(v.target.id);Object.values(v).forEach(scan)};scan(t.taskRequirements||t.requirements||t._en?.taskRequirements||t._en?.requirements);return [...new Set(out)]}
function computeRanks(list){const by=new Map(list.map(t=>[t._id,t])),memo=new Map(),vis=new Set();const rank=id=>{if(memo.has(id))return memo.get(id);if(vis.has(id))return 0;vis.add(id);const t=by.get(id);let r=0;if(t)for(const p of reqTaskIds(t))if(by.has(p))r=Math.max(r,rank(p)+1);vis.delete(id);memo.set(id,r);return r};list.forEach(t=>rank(t._id));taskRanks=memo;const sorted=[...list].sort((a,b)=>(memo.get(a._id)||0)-(memo.get(b._id)||0)||(a.minPlayerLevel||0)-(b.minPlayerLevel||0)||(a._sourceIndex??999999)-(b._sourceIndex??999999));taskTopo=new Map(sorted.map((t,i)=>[t._id,i]))}
const orderOf=t=>taskTopo.get(t._id)??999999,rankOf=t=>taskRanks.get(t._id)??999999;
const taskSort=(a,b)=>orderOf(a)-orderOf(b)||rankOf(a)-rankOf(b)||(a.minPlayerLevel||0)-(b.minPlayerLevel||0)||(a._sourceIndex??999999)-(b._sourceIndex??999999);
function taskMapName(t){return t.map?.name||t.mapName||t.location?.name||""}
function traderName(t){return t.trader?.name||t.traderName||"不明"}
function relevantTasks(){return tasks.filter(t=>{const m=taskMapName(t);return !m||normMap(m)===normMap(currentMap)||String(t.name||"").toLowerCase().includes(currentMap.toLowerCase())})}
function normMap(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"").replace("groundzero","groundzero")}
function renderTabs(){const tabs=[{id:"all",label:"全タスク"},...traders.map(x=>({id:x,label:x}))];$("#taskTabs").innerHTML=tabs.map(t=>`<button class="tab ${taskTab===t.id?"active":""}" data-id="${esc(t.id)}">${esc(t.label)}</button>`).join("");$$("#taskTabs .tab").forEach(b=>b.onclick=()=>{taskTab=b.dataset.id;renderTabs();renderTaskLists()})}
function renderTaskLists(){let list=relevantTasks();if(taskTab!=="all")list=list.filter(t=>traderName(t)===taskTab);if(!$("#showCompleted").checked)list=list.filter(t=>!states[t._id]?.completed);list=list.sort((a,b)=>{const sa=states[a._id]||{active:false,completed:false},sb=states[b._id]||{active:false,completed:false};if(sa.active!==sb.active)return sa.active?-1:1;return taskSort(a,b)});$("#taskList").innerHTML=list.slice(0,300).map(taskRow).join("")||'<div class="task-row">該当タスクなし</div>';$$(".task-name").forEach(el=>el.onclick=()=>openTask(el.dataset.id));$$(".active-check").forEach(el=>el.onchange=()=>setTaskState(el.dataset.id,"active",el.checked));$$(".complete-check").forEach(el=>el.onchange=()=>setTaskState(el.dataset.id,"completed",el.checked));renderSummary()}
function taskRow(t){const s=states[t._id]||{};return `<div class="task-row"><div class="task-name" data-id="${esc(t._id)}">${esc(t.name||t._en?.name||"Task")}</div><div class="task-meta">${esc(traderName(t))} / Lv.${t.minPlayerLevel||0}</div><div class="task-checks"><label><input class="active-check" data-id="${esc(t._id)}" type="checkbox" ${s.active?"checked":""}>進行中</label><label><input class="complete-check" data-id="${esc(t._id)}" type="checkbox" ${s.completed?"checked":""}>完了</label></div></div>`}
function setTaskState(id,key,val){const s=states[id]||(states[id]={active:false,completed:false});s[key]=val;if(key==="active"&&val)s.completed=false;if(key==="completed"&&val)s.active=false;saveStates();renderTaskLists()}
function renderSummary(){const vals=Object.values(states);$("#taskSummary").innerHTML=`進行中 <span class="status-pill">${vals.filter(x=>x.active).length}</span><br>完了 <span class="status-pill">${vals.filter(x=>x.completed).length}</span>`}
function objectiveText(t){const arr=t.objectives||t._en?.objectives||[];if(!arr.length)return "目的データなし";return arr.map((o,i)=>`${i+1}. ${o.description||o.type||"Objective"}`).join("<br>")}
function extractKeys(t){const keys=[];const add=x=>{if(!x)return;if(Array.isArray(x))return x.forEach(add);if(typeof x==="string"){if(/key/i.test(x))keys.push(x);return}if(typeof x!=="object")return;const n=x.name||x.shortName||x.item?.name||x.item?.shortName;if(n&&/key/i.test(n))keys.push(n);Object.values(x).forEach(add)};add(t.neededKeys);add(t.requiredKeys);add(t._en?.neededKeys);add(t._en?.requiredKeys);add(t.objectives);add(t._en?.objectives);return [...new Set(keys)]}
function wikiUrl(t){const q=encodeURIComponent(t.name||t._en?.name||"");return `https://wikiwiki.jp/eft/?cmd=search&word=${q}`}
function openTask(id){const t=tasks.find(x=>x._id===id);if(!t)return;const keys=extractKeys(t);$("#taskModalTitle").textContent=t.name||t._en?.name||"Task";$("#taskModalBody").innerHTML=`<b>トレーダー:</b> ${esc(traderName(t))}<br><b>必要レベル:</b> ${t.minPlayerLevel||0}<h3>タスク目的</h3>${objectiveText(t)}${keys.length?`<h3>🔑 必要な鍵</h3>${keys.map(esc).join("<br>")}`:""}<h3>Wiki</h3><a href="${wikiUrl(t)}" target="_blank" rel="noopener">日本語Wikiで確認</a>`;$("#taskModalBg").classList.remove("hidden")}
function wireTaskModal(){$("#taskModalClose").onclick=()=>$("#taskModalBg").classList.add("hidden");$("#taskModalBg").onclick=e=>{if(e.target.id==="taskModalBg")e.currentTarget.classList.add("hidden")};$("#showCompleted").onchange=renderTaskLists}
function sendSync(msg){if(syncApplying)return;const data=JSON.stringify({...msg,room});connections.forEach(c=>{try{if(c.readyState==="open")c.send(data)}catch{}})}
function syncSnapshot(){return {kind:"snapshot",room,map:currentMap,floor:currentFloor,states,pins:Object.fromEntries(MAPS.map(m=>[m.name,loadPins(m.name)]))}}
function applySync(msg){if(!msg||msg.room!==room)return;syncApplying=true;try{if(msg.kind==="snapshot"){if(msg.states){states=msg.states;saveStates(false)};if(msg.pins)Object.entries(msg.pins).forEach(([m,p])=>savePins(p,m,false));if(msg.map&&MAPS.some(x=>x.name===msg.map)){currentMap=msg.map;currentFloor=mapCfg().floors.includes(msg.floor)?msg.floor:mapCfg().defaultFloor;$("#mapSelect").value=currentMap;fillFloors();loadMap();renderTaskLists();saveView(false)}}else if(msg.kind==="pins"&&msg.map){savePins(msg.pins||[],msg.map,false);if(msg.map===currentMap)renderPins()}else if(msg.kind==="taskStates"){states=msg.states||{};saveStates(false);renderTaskLists()}else if(msg.kind==="view"&&msg.map&&MAPS.some(x=>x.name===msg.map)){currentMap=msg.map;currentFloor=mapCfg().floors.includes(msg.floor)?msg.floor:mapCfg().defaultFloor;$("#mapSelect").value=currentMap;fillFloors();loadMap();renderTaskLists();saveView(false)}}finally{syncApplying=false}}
function createPeer(isHost){cleanupPeer(false);room=isHost?makeRoomId():room;peer=new RTCPeerConnection({iceServers:[{urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]}]});peer.ondatachannel=e=>attachChannel(e.channel);peer.onicecandidate=e=>{if(!e.candidate)updateInviteFromLocal()};return peer}
function attachChannel(ch){connections.push(ch);ch.onopen=()=>{updateShareStatus();if(location.hash.includes("host"))ch.send(JSON.stringify(syncSnapshot()))};ch.onmessage=e=>{try{applySync(JSON.parse(e.data))}catch{}};ch.onclose=updateShareStatus}
function makeRoomId(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-5)}
async function hostRoom(){createPeer(true);location.hash="host";const ch=peer.createDataChannel("tarkov-share");attachChannel(ch);const offer=await peer.createOffer();await peer.setLocalDescription(offer);updateShareStatus("接続情報を作成中…");await waitIce();const token=btoa(unescape(encodeURIComponent(JSON.stringify(peer.localDescription)))).replaceAll("+","-").replaceAll("/","_").replaceAll("=","");const u=new URL(location.href);u.searchParams.set("room",room);u.searchParams.set("offer",token);u.hash="";$("#inviteField").value=u.toString();updateShareStatus("共有ルーム待機中：招待リンクをフレンドに送ってください。")}
async function joinFromUrl(){const u=new URL(location.href),r=u.searchParams.get("room"),offerToken=u.searchParams.get("offer");if(!r||!offerToken)return;room=r;createPeer(false);const chPromise=new Promise(res=>peer.ondatachannel=e=>{attachChannel(e.channel);res(e.channel)});const offer=JSON.parse(decodeURIComponent(escape(atob(offerToken.replaceAll("-","+").replaceAll("_","/")+"===".slice((offerToken.length+3)%4)))));await peer.setRemoteDescription(offer);const answer=await peer.createAnswer();await peer.setLocalDescription(answer);await waitIce();const ans=btoa(unescape(encodeURIComponent(JSON.stringify(peer.localDescription)))).replaceAll("+","-").replaceAll("/","_").replaceAll("=","");const answerUrl=new URL(location.href);answerUrl.searchParams.delete("offer");answerUrl.searchParams.set("answer",ans);$("#inviteField").value=answerUrl.toString();updateShareStatus("参加情報を作成しました。このURLをルーム作成者へ1回だけ返してください。")}
async function acceptAnswerFromUrl(){const u=new URL(location.href),ans=u.searchParams.get("answer"),r=u.searchParams.get("room");if(!ans||!r||!peer||room!==r)return false;const answer=JSON.parse(decodeURIComponent(escape(atob(ans.replaceAll("-","+").replaceAll("_","/")+"===".slice((ans.length+3)%4)))));await peer.setRemoteDescription(answer);updateShareStatus();return true}
function waitIce(){return new Promise(res=>{if(peer.iceGatheringState==="complete")return res();const f=()=>{if(peer.iceGatheringState==="complete"){peer.removeEventListener("icegatheringstatechange",f);res()}};peer.addEventListener("icegatheringstatechange",f);setTimeout(res,3500)})}
function updateInviteFromLocal(){}
function updateShareStatus(text){if(text)return $("#shareStatus").textContent=text;const n=connections.filter(c=>c.readyState==="open").length;$("#shareStatus").textContent=room?`共有中：${n}人接続 / ルーム ${room}`:"共有ルーム未作成"}
function cleanupPeer(clear=true){try{connections.forEach(c=>c.close())}catch{}connections=[];try{peer?.close()}catch{}peer=null;if(clear){room=null;$("#inviteField").value="";history.replaceState(null,"",location.pathname+location.search.replace(/([?&])(room|offer|answer)=[^&]*/g,"").replace(/[?&]$/,""));updateShareStatus()}}
function wireShare(){$("#shareOpen").onclick=()=>$("#shareModalBg").classList.remove("hidden");$("#shareClose").onclick=()=>$("#shareModalBg").classList.add("hidden");$("#shareModalBg").onclick=e=>{if(e.target.id==="shareModalBg")e.currentTarget.classList.add("hidden")};$("#createRoom").onclick=async()=>{if(location.protocol==="file:"){updateShareStatus("Web公開版から共有してください。file:// のリンクはフレンドに送れません。");return}try{await hostRoom()}catch(e){updateShareStatus("共有ルーム作成に失敗しました: "+e.message)}};$("#copyInvite").onclick=async()=>{const v=$("#inviteField").value;if(!v)return;await navigator.clipboard.writeText(v).catch(()=>{});updateShareStatus("招待リンクをコピーしました。")};$("#endShare").onclick=()=>cleanupPeer(true)}
async function initShareUrl(){const u=new URL(location.href);if(u.searchParams.has("offer")){$("#shareModalBg").classList.remove("hidden");await joinFromUrl()}else if(u.searchParams.has("answer")){$("#shareModalBg").classList.remove("hidden");updateShareStatus("ルーム作成者側で、このURLを開いて接続を完了してください。")}}
window.addEventListener("hashchange",()=>{});
window.addEventListener("resize",()=>{if(document.querySelector(".map-content")){zoom=fitZoom();panX=panY=0;updateTransform()}});
(async function init(){restoreView();setupSelects();wireToolbar();wireTaskModal();wireShare();await loadMap();await loadTasks();await initShareUrl();})();
</script>
